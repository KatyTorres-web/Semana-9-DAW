<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 09 - PHP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #e0f2fe, #eef2ff 55%, #f5f3ff);
            color: #1e293b;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            width: min(100%, 460px);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12);
        }

        h1 {
            margin: 0 0 10px;
            color: #1d4ed8;
            font-size: clamp(1.7rem, 5vw, 2rem);
        }

        main > p {
            margin: 0 0 30px;
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #1e293b;
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .field {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            background: #1d4ed8;
        }

        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            main {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Formulario de registro - PHP</h1>
        <p>Desarrollo de Aplicaciones Web - Semana 09</p>

        <form action="procesar.php" method="POST">
            <div class="field">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
            </div>

            <button type="submit">Enviar datos</button>
        </form>
    </main>
</body>
</html>
